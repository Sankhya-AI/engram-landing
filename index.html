      <article>
        <h1>Dhee — Self-Evolving Memory & Context Router for AI Agents</h1>
        <p>
          Dhee is an open-source memory and context-router layer for LLM agents. It cuts token usage by 90%+ on
          Claude Code, Cursor, Codex, Gemini CLI, Aider, Cline, and any MCP-compatible client — and leads the
          LongMemEval benchmark at R@1 94.8% and R@5 99.4% on the full 500-question set.
        </p>
        <h2>What Dhee does</h2>
        <ul>
          <li><strong>Self-evolving memory:</strong> chunks your CLAUDE.md, AGENTS.md, and skills library into decay-aware vector memory; injects only the ~300 relevant tokens per turn.</li>
          <li><strong>Context router:</strong> digests Read, Bash, and subagent output at source — a 10 MB git log becomes a 40-token summary with a pointer the model can expand if needed.</li>
          <li><strong>Perfect recall, years in:</strong> Ebbinghaus decay, auto-promotion, and insight synthesis keep the per-turn cost flat even as memory crosses 50,000 entries.</li>
          <li><strong>Self-tuning policy:</strong> the retrieval depth per tool and per intent is learned from actual expansion patterns, not hand-configured.</li>
        </ul>
        <h2>Works with</h2>
        <p>Claude Code, Cursor, Codex, Gemini CLI, Aider, Cline, Goose, Claude Desktop, Python SDK, CLI, and Docker.</p>
