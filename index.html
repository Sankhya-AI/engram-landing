          "@type": "Question",
          "name": "What is Dhee?",
          "acceptedAnswer": {
            "@type": "Answer",
          "text": "Dhee is an agent memory runtime. It stores useful user, project, repo, scene, and handoff memory, then compiles compact context before the next action."
          }
        },
        {
          "@type": "Question",
          "name": "How does Dhee improve an existing agent?",
          "acceptedAnswer": {
            "@type": "Answer",
          "text": "Dhee adds a simple loop: compact context before the run, a dhee_memory tool during the run, and checkpoints after the run."
          }
        },
        {
          "@type": "Question",
          "name": "How is Dhee different from Mem0, Letta, MemPalace, and agentmemory?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Dhee is the only agent memory layer that leads LongMemEval at R@5 99.4% on the full 500-question set, self-evolves its retrieval policy per tool and per intent, and ships a context router that digests Read, Bash, and subagent output at source instead of dumping raw output into context."
          }
        },
        {
          "@type": "Question",
          "name": "Does Dhee work with ElevenLabs, Gemini, OpenAI, Codex, or MCP clients?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Dhee has native provider helpers for ElevenLabs voice agents, Gemini API agents, and OpenAI Responses agents, plus MCP, Python SDK, HTTP sidecar, CLI, and Docker surfaces."
          }
        },
        {
          "@type": "Question",
          "name": "Is Dhee production-ready? What storage does it use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Dhee runs on SQLite by default and can use local or hosted providers for embeddings, reranking, and rollups. Deterministic filters still run first: secrets, private scenes, contradictions, supersession, and proof gates."
          }
        },
        {
          "@type": "Question",
          "name": "How does Dhee's self-evolution actually work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every time the model calls dhee_expand_result(ptr) to see the raw output behind a digest, Dhee logs the tool, intent, and depth. The command dhee router tune reads that ledger and atomically rewrites ~/.dhee/router_policy.json — deeper digests for file types the model keeps expanding, shallower ones it never does. No config to hand-maintain."
          }
        }
      ]
    }

      <article>
        <h1>Dhee - Agent Memory Runtime</h1>
        <p>
          Dhee gives agents useful memory before, during, and after work. It compiles compact
          context, exposes a memory tool, and checkpoints what should matter next time.
        </p>
        <h2>What Dhee does</h2>
        <ul>
          <li><strong>Context:</strong> starts a run with the useful user, project, repo, scene, and handoff facts.</li>
          <li><strong>Memory tool:</strong> lets agents recall or save information during work.</li>
          <li><strong>Filtering:</strong> keeps transcript noise, stale claims, and secrets out of default context.</li>
          <li><strong>Checkpoints:</strong> saves outcomes, corrections, preferences, proof, and open tasks for the next run.</li>
        </ul>
        <h2>Works with</h2>
        <p>ElevenLabs voice agents, Gemini API agents, OpenAI Responses agents, Codex, Claude Code, MCP clients, Python SDK, CLI, HTTP, and Docker.</p>
