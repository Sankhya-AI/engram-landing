      <article>
        <h1>Dhee — The Cognition Layer That Turns Your Agent into a HyperAgent</h1>
        <p>
          Dhee is an open-source cognition layer for self-improving agents. It adds persistent memory,
          performance tracking, insight synthesis, and prospective memory so agents can remember what happened,
          learn from outcomes, and continue work across tools and sessions.
        </p>
        <h2>What Dhee adds</h2>
        <ul>
          <li><strong>Persistent memory:</strong> store facts, preferences, and observations with retrieval that survives rephrasing.</li>
          <li><strong>Performance tracking:</strong> measure task outcomes, detect regressions, and surface warnings early.</li>
          <li><strong>Insight synthesis:</strong> convert what worked and what failed into reusable learnings.</li>
          <li><strong>Prospective memory:</strong> remember to do something later when the right trigger appears.</li>
        </ul>
        <h2>Interfaces</h2>
        <p>Dhee works through MCP, Python, CLI, and Docker, and integrates with Claude Code, Cursor, Codex, Claude Desktop, and custom runtimes.</p>
        <p><a href="https://github.com/Sankhya-AI/Dhee">View on GitHub</a></p>
