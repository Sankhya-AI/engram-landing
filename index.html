    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Dhee?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Dhee is a context manager for coding agents. It sits between your agent and the model, decides what context should be admitted, keeps useful memory linked to evidence, and suppresses stale transcript and tool-output bloat."
          }
        },
        {
          "@type": "Question",
          "name": "How does Dhee reduce Claude Code token usage?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Two mechanisms. First, a 500-line CLAUDE.md that normally re-loads every turn becomes a vector-indexed memory that injects only matching rules — about 240 tokens instead of 5,700. Second, the router wraps Read and Bash so a 10 MB git log becomes a 40-token digest with a pointer; raw content only re-enters context if the model explicitly expands the pointer. Typical reduction is 90%+."
          }
        },
        {
          "@type": "Question",
          "name": "How is Dhee different from Mem0, Letta, MemPalace, and agentmemory?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Dhee is the only agent memory layer that leads LongMemEval at R@5 99.4% on the full 500-question set, self-evolves its retrieval policy per tool and per intent, and ships a context router that digests Read, Bash, and subagent output at source instead of dumping raw output into context."
          }
        },
        {
          "@type": "Question",
          "name": "Does Dhee work with Cursor, Codex, Gemini CLI, Aider, Cline, or Goose?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Dhee exposes an MCP server that plugs into any MCP-compatible client — Claude Code, Cursor, Codex, Gemini CLI, Cline, Goose, Claude Desktop — plus native Claude Code hooks, a Python SDK, a CLI, and Docker. One install, every host."
          }
        },
        {
          "@type": "Question",
          "name": "Is Dhee production-ready? What storage does it use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Dhee runs on SQLite by default — no Postgres, no Qdrant, no pgvector, no extra infrastructure. It has 1000+ tests, reproducible benchmarks committed in-tree, an MIT license, and works offline with Ollama embeddings or online with OpenAI, NVIDIA NIM, or Google Gemini."
          }
        },
        {
          "@type": "Question",
          "name": "How does Dhee's self-evolution actually work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every time the model calls dhee_expand_result(ptr) to see the raw output behind a digest, Dhee logs the tool, intent, and depth. The command dhee router tune reads that ledger and atomically rewrites ~/.dhee/router_policy.json — deeper digests for file types the model keeps expanding, shallower ones it never does. No config to hand-maintain."
          }
        }
      ]
    }

        <h1>Dhee — Context Manager for Coding Agents</h1>
        <p>
          Dhee is a Sankhya AI Labs product that decides what your coding agent should see,
          remember, and forget each turn, so Codex, Claude Code, and MCP-native agents stay cheap,
          reliable, and auditable.
        </p>
        <h2>What Dhee does</h2>
        <ul>
          <li><strong>Compiled state:</strong> keeps the current goal, plan, decisions, files, and receipts compact.</li>
          <li><strong>Context admission:</strong> routes relevant project rules and suppresses stale transcript or tool output.</li>
          <li><strong>Pointer evidence:</strong> stores large raw outputs behind expandable references instead of dumping them into the prompt.</li>
          <li><strong>Auditable memory:</strong> links assertions back to admitted evidence so old assumptions can be corrected.</li>
        </ul>
        <h2>Works with</h2>
